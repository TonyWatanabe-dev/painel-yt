name: coletar
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: coletar
  cancel-in-progress: false
jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yt-dlp
      - name: coleta
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          CANAIS: ${{ secrets.CANAIS }}
          PAINEL_DIR: data
        run: |
          mkdir -p data
          python gist_sync.py baixar historico.json
          python coletar.py completo
          python gist_sync.py enviar dados.json historico.json
