<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel YouTube</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f0f12">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0f0f12;--card:#18181d;--card2:#1f1f26;--line:#2a2a33;--tx:#ececf1;--mut:#8b8b99;--acc:#ff3b3b;--ok:#2ecc71;--bad:#ff5d5d;--warn:#ffcc33}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.4}
a{color:inherit;text-decoration:none}
a:hover{color:var(--acc)}
.wrap{max-width:1440px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.logo i{width:26px;height:18px;background:var(--acc);border-radius:5px;position:relative;display:inline-block}
.logo i:after{content:"";position:absolute;left:10px;top:4px;border-left:8px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent}
.sp{flex:1}
.upd{color:var(--mut);font-size:13px}
button{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.warn{background:#3a3010;border:1px solid #7a6516;color:var(--warn);padding:10px 14px;border-radius:10px;margin-bottom:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.tab{display:flex;align-items:center;gap:8px;white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px}
.tab.on{border-color:var(--acc);background:#2a1618}
.tab.all{padding-left:14px}
.av{width:26px;height:26px;border-radius:50%;background:var(--card2);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;position:relative;overflow:hidden;flex:none;color:var(--mut)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.l{width:72px;height:72px;font-size:28px}
.av.s{width:22px;height:22px;font-size:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:15px;font-weight:650;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:700;margin-top:2px}
.kpi .s{color:var(--mut);font-size:12px;margin-top:2px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mut{color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th.t,td.t{text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px;cursor:pointer;user-select:none}
th:hover{color:var(--tx)}
th.srt{color:var(--acc)}
tbody tr:hover{background:var(--card2)}
tr.vr{cursor:pointer}
.nm{display:flex;align-items:center;gap:10px;font-weight:600}
.ttl{white-space:normal;min-width:220px;max-width:380px}
.thumb{width:96px;height:54px;object-fit:cover;border-radius:6px;background:var(--card2);display:block}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--card2);border:1px solid var(--line)}
.badge.sh{background:#2a1618;border-color:#5a2226;color:#ff8a8a}
.pbar{display:flex;height:22px;border-radius:8px;overflow:hidden;background:var(--card2)}
.pbar div{min-width:2px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--mut)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.chart{position:relative;width:100%}
.chart svg{display:block}
.tip{position:absolute;pointer-events:none;background:#000d;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;white-space:nowrap;z-index:5;display:none}
.empty{color:var(--mut);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.note{color:var(--mut);font-size:12px;margin-top:6px}
ul.ins{margin:0;padding-left:18px}
ul.ins li{margin:6px 0}
.hdr{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hdr h1{margin:0;font-size:22px}
.hdr .d{color:var(--mut);max-width:720px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.links a{background:var(--card2);border:1px solid var(--line);padding:5px 12px;border-radius:8px;font-size:13px;display:inline-block}
.links a:hover{border-color:var(--acc)}
.vl{display:flex;align-items:center;gap:10px}
.vl .thumb{width:64px;height:36px}
.vl a{white-space:normal}
.cc{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:12px}
footer{color:var(--mut);font-size:12px;text-align:center;padding:16px}
@media(max-width:600px){.wrap{padding:10px}.kpi .v{font-size:20px}.hdr h1{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><i></i>Painel YouTube</div>
    <div class="sp"></div>
    <div class="upd" id="upd"></div>
    <button id="reload" type="button">Recarregar dados</button>
  </header>
  <div id="warn"></div>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>

<script id="dados-js" src="dados.js"></script>
<script>
(function(){
'use strict';
var TZ='America/Sao_Paulo';
var PALETTE=['#ff3b3b','#4cc9f0','#ffd166','#06d6a0','#b388ff','#ff8fab','#f8961e','#90be6d','#a0a0ff','#f4a261'];
var nf=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
var nf1=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1});
var nf2=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:2});
var DAY=86400e3,HOUR=3600e3;
var state={view:'geral',metric:'views',sortRank:{k:'views',d:-1},sortVid:{k:'pub',d:-1},open:{}};
var post=[];

function P(){return window.PAINEL||{canais:[],snapshots:[],atualizado:null};}
function isn(v){return typeof v==='number'&&isFinite(v);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(v){if(!isn(v))return '—';var a=Math.abs(v);if(a>=1e6)return nf1.format(v/1e6)+' mi';if(a>=1e4)return nf1.format(v/1e3)+' mil';return nf.format(Math.round(v));}
function fmtFull(v){return isn(v)?nf.format(v):'—';}
function fmtD(v){if(!isn(v))return '—';if(Math.abs(v)>=1000)return fmt(v);return nf1.format(v);}
function fmtPct(v,d){if(!isn(v))return '—';return new Intl.NumberFormat('pt-BR',{maximumFractionDigits:d==null?1:d}).format(v)+'%';}
function fmtDelta(v){if(!isn(v))return '—';if(v<0)v=0;return (v>0?'+':v<0?'−':'')+fmt(Math.abs(v));}
function dcls(v){return !isn(v)?'mut':v>0?'pos':v<0?'neg':'mut';}
function ts(iso){var t=Date.parse(iso);return isNaN(t)?null:t;}
var dfDate=new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,day:'2-digit',month:'2-digit',year:'numeric'});
var dfDT=new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
var dfShort=new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,day:'2-digit',month:'2-digit'});
var dfShortT=new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
function fDate(t){return isn(t)?dfDate.format(t):'—';}
function fDT(t){return isn(t)?dfDT.format(t):'—';}
function medianOf(a){a=a.filter(isn).slice().sort(function(x,y){return x-y;});if(!a.length)return null;var m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2;}
function meanOf(a){a=a.filter(isn);return a.length?a.reduce(function(s,x){return s+x;},0)/a.length:null;}
function refT(){var t=ts(P().atualizado);return t==null?Date.now():t;}
function fAgoMs(ms){var m=Math.floor(ms/60000);if(m<1)return 'menos de 1 min';if(m<60)return m+' min';var h=Math.floor(m/60);if(h<24)return h+' h '+(m%60)+' min';var d=Math.floor(h/24);return d+(d===1?' dia':' dias');}
function bsDay(t){var s=new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(t);return Date.parse(s+'T00:00:00Z')/DAY;}
function daysAgoTxt(t){if(!isn(t))return '—';var d=Math.round(bsDay(refT())-bsDay(t));if(d===1)return 'ontem';if(d<=0)return 'hoje';if(d===1)return 'há 1 dia';return 'há '+d+' dias';}
function fDur(s){if(!isn(s))return '—';s=Math.round(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;var p=function(n){return n<10?'0'+n:''+n;};return h?h+':'+p(m)+':'+p(x):m+':'+p(x);}
function bsParts(t){var p={};new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,weekday:'long',hour:'2-digit',hour12:false}).formatToParts(t).forEach(function(x){p[x.type]=x.value;});return p;}

/* ---------- dados derivados ---------- */
function canais(){return P().canais||[];}
function colorOf(c){var i=canais().indexOf(c);return PALETTE[(i<0?0:i)%PALETTE.length];}
function colorById(id){var cs=canais();for(var i=0;i<cs.length;i++)if(cs[i].id===id)return PALETTE[i%PALETTE.length];return PALETTE[0];}
function snaps(){return (P().snapshots||[]).filter(function(s){return ts(s.t)!=null;}).sort(function(a,b){return ts(a.t)-ts(b.t);});}
function snapVal(s,id,m){
  var cs=s.canais||{};
  if(id){var c=cs[id];return c&&isn(c[m])?c[m]:null;}
  var atuais={};canais().forEach(function(c){atuais[c.id]=1;});
  var sum=0,any=false;for(var k in cs){if(!atuais[k])continue;var v=cs[k]&&cs[k][m];if(isn(v)){sum+=v;any=true;}}
  return any?sum:null;
}
function delta(id,m,ms){
  var S=snaps();if(S.length<2)return null;
  var last=S[S.length-1],cur=snapVal(last,id,m);if(cur==null)return null;
  var target=ts(last.t)-ms,best=null,bd=Infinity;
  for(var i=0;i<S.length-1;i++){var v=snapVal(S[i],id,m);if(v==null)continue;var d=Math.abs(ts(S[i].t)-target);if(d<bd){bd=d;best=v;}}
  if(best==null||bd>ms*0.5)return null;
  return Math.max(0,cur-best);
}
function series(id,m){return snaps().map(function(s){return [ts(s.t),snapVal(s,id,m)];}).filter(function(p){return p[1]!=null;});}
function pubT(v){return ts(v.publicado);}
function vViewsPerDay(v){var p=pubT(v);if(p==null||!isn(v.views))return null;var d=Math.max((refT()-p)/DAY,1);return v.views/d;}
function vDelta24(v){
  if(!isn(v.views))return null;
  var p=pubT(v);if(p!=null&&refT()-p<=DAY)return v.views;
  var s=(v.serie||[]).filter(function(x){return ts(x[0])!=null&&isn(x[1]);});
  if(s.length<2)return null;
  var last=s[s.length-1],lt=ts(last[0]),target=lt-DAY,best=null,bd=Infinity;
  for(var i=0;i<s.length-1;i++){var d=Math.abs(ts(s[i][0])-target);if(d<bd){bd=d;best=s[i][1];}}
  if(best==null||bd>DAY*0.5)return null;
  return Math.max(0,last[1]-best);
}
function hotRate(v){
  if(!isn(v.views))return null;
  var s=(v.serie||[]).filter(function(x){return ts(x[0])!=null&&isn(x[1]);});
  if(s.length>=2){
    var last=s[s.length-1],lt=ts(last[0]),target=lt-DAY,best=null,bd=Infinity;
    for(var i=0;i<s.length-1;i++){var d=Math.abs(ts(s[i][0])-target);if(d<bd){bd=d;best=s[i];}}
    if(best){var dt=(lt-ts(best[0]))/HOUR;if(dt>=0.5){var hr=Math.max(0,(last[1]-best[1])/dt);return {h:hr,txt:fmtD(hr)+'/h',real:true};}}
  }
  var p=pubT(v);if(p==null)return null;
  var days=Math.max((refT()-p)/DAY,1);
  return {h:v.views/days/24,txt:fmtD(v.views/days)+'/dia (est.)',real:false};
}
function sortedByPub(vs){return vs.slice().sort(function(a,b){var x=pubT(a),y=pubT(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return y-x;});}
function lastUpload(c){var t=null;(c.videos||[]).forEach(function(v){var p=pubT(v);if(p!=null&&(t==null||p>t))t=p;});return t;}
function cstats(c){
  var vs=c.videos||[],views=vs.map(function(v){return v.views;}).filter(isn);
  var nv=isn(c.videos_count)?c.videos_count:vs.length;
  var last10=sortedByPub(vs).slice(0,10).map(function(v){return v.views;});
  var vt=isn(c.views_total)?c.views_total:(views.length?views.reduce(function(a,b){return a+b;},0):null);
  var lt=isn(c.likes_total)?c.likes_total:null;
  var nS=isn(c.n_shorts)?c.n_shorts:vs.filter(function(v){return v.short;}).length;
  var nL=vs.length-vs.filter(function(v){return v.short;}).length;
  return {
    c:c,nome:c.nome||c.id,nv:nv,nvLoaded:vs.length,vt:vt,lt:lt,ins:isn(c.inscritos)?c.inscritos:null,
    media:vs.length&&vt!=null?vt/vs.length:null,
    med:medianOf(views),med10:medianOf(last10),
    likepct:(vt>0&&lt!=null)?lt/vt*100:null,
    v24:delta(c.id,'views',DAY),
    last:lastUpload(c),nS:nS,nL:nL
  };
}

/* ---------- SVG ---------- */
function spark(vals,w,h,color){
  vals=vals.filter(isn);
  if(vals.length<2)return '<span class="mut" title="coletando histórico">—</span>';
  var mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),r=(mx-mn)||1,pts=[];
  for(var i=0;i<vals.length;i++)pts.push((2+i/(vals.length-1)*(w-4)).toFixed(1)+','+(h-2-(vals[i]-mn)/r*(h-4)).toFixed(1));
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><polyline fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linejoin="round" points="'+pts.join(' ')+'"/></svg>';
}
function niceMax(v){var mag=Math.pow(10,Math.floor(Math.log10(v))),n=v/mag;var k=n<=1?1:n<=2?2:n<=4?4:n<=8?8:10;return k*mag;}
function tickFmt(v){return (v<10&&v%1)?nf2.format(v):fmt(v);}
function lineChart(host,ser,o){
  o=o||{};
  var W=Math.max(host.clientWidth||600,280),H=o.h||250,m={l:50,r:14,t:12,b:28};
  var all=[];ser.forEach(function(s){s.pts.forEach(function(p){if(isn(p[1])&&isn(p[0]))all.push(p);});});
  host.innerHTML='';
  if(!all.length){host.innerHTML='<div class="empty">Sem dados para o gráfico.</div>';return;}
  var x0=Math.min.apply(null,all.map(function(p){return p[0];})),x1=Math.max.apply(null,all.map(function(p){return p[0];}));
  var single=x0===x1;if(single){x0-=6*HOUR;x1+=6*HOUR;}
  var y1=Math.max.apply(null,all.map(function(p){return p[1];}));if(y1<=0)y1=1;y1=niceMax(y1);
  var sx=function(t){return m.l+(t-x0)/(x1-x0)*(W-m.l-m.r);};
  var sy=function(v){return H-m.b-v/y1*(H-m.t-m.b);};
  var g='';
  for(var i=0;i<=4;i++){var yv=y1*i/4,yy=sy(yv);g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+yy+'" y2="'+yy+'" stroke="#2a2a33"/><text x="'+(m.l-6)+'" y="'+(yy+4)+'" text-anchor="end" fill="#8b8b99" font-size="11">'+tickFmt(yv)+'</text>';}
  var nx=Math.max(2,Math.min(5,Math.floor((W-m.l-m.r)/110)));
  var fmtX=((x1-x0)<2*DAY)?dfShortT:dfShort;
  for(var j=0;j<nx;j++){var xt=x0+(x1-x0)*j/(nx-1);g+='<text x="'+sx(xt)+'" y="'+(H-8)+'" text-anchor="'+(j===0?'start':j===nx-1?'end':'middle')+'" fill="#8b8b99" font-size="11">'+fmtX.format(xt)+'</text>';}
  ser.forEach(function(s){
    var pts=s.pts.filter(function(p){return isn(p[1])&&isn(p[0]);});
    if(pts.length>1)g+='<polyline fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round" points="'+pts.map(function(p){return sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1);}).join(' ')+'"/>';
    if(pts.length<=40)pts.forEach(function(p){g+='<circle cx="'+sx(p[0]).toFixed(1)+'" cy="'+sy(p[1]).toFixed(1)+'" r="'+(pts.length===1?4.5:3)+'" fill="'+s.color+'"/>';});
  });
  g+='<line class="gl" y1="'+m.t+'" y2="'+(H-m.b)+'" stroke="#8b8b99" stroke-dasharray="3 3" style="display:none"/>';
  host.innerHTML='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+g+'<rect class="ov" x="'+m.l+'" y="'+m.t+'" width="'+(W-m.l-m.r)+'" height="'+(H-m.t-m.b)+'" fill="transparent"/></svg><div class="tip"></div>';
  var svg=host.querySelector('svg'),tip=host.querySelector('.tip'),gl=host.querySelector('.gl');
  var times=[];all.forEach(function(p){if(times.indexOf(p[0])<0)times.push(p[0]);});
  svg.querySelector('.ov').addEventListener('mousemove',function(e){
    var r=svg.getBoundingClientRect(),mx=e.clientX-r.left,best=times[0],bd=Infinity;
    times.forEach(function(t){var d=Math.abs(sx(t)-mx);if(d<bd){bd=d;best=t;}});
    var h='<b>'+fDT(best)+'</b>';
    ser.forEach(function(s){var f=null;s.pts.forEach(function(p){if(p[0]===best)f=p[1];});if(f!=null)h+='<div><span class="dot" style="background:'+s.color+'"></span> '+esc(s.name)+': '+fmtFull(f)+'</div>';});
    tip.innerHTML=h;tip.style.display='block';
    var left=sx(best)+12;if(left+tip.offsetWidth>W)left=sx(best)-tip.offsetWidth-12;
    tip.style.left=Math.max(0,left)+'px';tip.style.top='8px';
    gl.setAttribute('x1',sx(best));gl.setAttribute('x2',sx(best));gl.style.display='';
  });
  svg.querySelector('.ov').addEventListener('mouseleave',function(){tip.style.display='none';gl.style.display='none';});
}
function barChart(host,vs,medVal){
  var W=Math.max(host.clientWidth||600,280),H=240,m={l:50,r:10,t:12,b:34};
  host.innerHTML='';
  if(!vs.length){host.innerHTML='<div class="empty">Sem vídeos.</div>';return;}
  var ymax=niceMax(Math.max(1,Math.max.apply(null,vs.map(function(v){return isn(v.views)?v.views:0;}))));
  var bw=(W-m.l-m.r)/vs.length,sy=function(v){return H-m.b-v/ymax*(H-m.t-m.b);};
  var best=null;vs.forEach(function(v){if(isn(v.views)&&(best==null||v.views>best.views))best=v;});
  var g='';
  for(var i=0;i<=4;i++){var yv=ymax*i/4,yy=sy(yv);g+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+yy+'" y2="'+yy+'" stroke="#2a2a33"/><text x="'+(m.l-6)+'" y="'+(yy+4)+'" text-anchor="end" fill="#8b8b99" font-size="11">'+tickFmt(yv)+'</text>';}
  var step=Math.max(1,Math.ceil(vs.length/Math.floor((W-m.l-m.r)/48)));
  vs.forEach(function(v,i){
    var val=isn(v.views)?v.views:0,x=m.l+i*bw+bw*0.15,w=bw*0.7,y=sy(val);
    var col=v===best?'#2ecc71':(medVal!=null&&val<medVal?'#7a3a3f':'#4a6fa5');

function timeline(host){

/* ---------- Visão de um canal ---------- */
function insights(c,s){
  var vs=c.videos||[],out=[];
  if(!vs.length)return ['Sem vídeos coletados para gerar insights.'];
  var best=null;vs.forEach(function(v){if(isn(v.views)&&(best==null||v.views>best.views))best=v;});
  if(best){
    if(s.med>0)out.push('Melhor vídeo: “'+esc(best.titulo)+'” com '+fmtFull(best.views)+' views — '+nf1.format(best.views/s.med)+'× a mediana do canal ('+fmt(s.med)+').');
    else out.push('Melhor vídeo: “'+esc(best.titulo)+'” com '+fmtFull(best.views)+' views.');
  }
  var L=vs.filter(function(v){return !v.short&&isn(v.views);}),S=vs.filter(function(v){return v.short&&isn(v.views);});
  if(L.length&&S.length){
    var ml=medianOf(L.map(function(v){return v.views;})),ms=medianOf(S.map(function(v){return v.views;}));
    var w=ml>=ms?'vídeos longos':'Shorts';
    out.push('Formato: '+w+' performam melhor (mediana de '+fmt(Math.max(ml,ms))+' vs '+fmt(Math.min(ml,ms))+' views; '+L.length+' longos e '+S.length+' Shorts).');
  }else if(vs.length)out.push('Todos os vídeos coletados são '+(S.length?'Shorts':'longos')+' — ainda não há como comparar formatos.');
  var LD=L.filter(function(v){return isn(v.duracao);});
  if(LD.length>=4){
    var md=medianOf(LD.map(function(v){return v.duracao;})),A=LD.filter(function(v){return v.duracao<=md;}),B=LD.filter(function(v){return v.duracao>md;});
    if(A.length&&B.length){
      var ma=medianOf(A.map(function(v){return v.views;})),mb=medianOf(B.map(function(v){return v.views;}));
      out.push('Duração: vídeos '+(ma>=mb?'mais curtos (até '+fDur(md)+')':'mais longos (acima de '+fDur(md)+')')+' têm mediana maior ('+fmt(Math.max(ma,mb))+' vs '+fmt(Math.min(ma,mb))+' views).');
    }
  }
  var wp=vs.filter(function(v){return pubT(v)!=null&&isn(v.views);}).sort(function(a,b){return b.views-a.views;}).slice(0,3);
  if(wp.length>=3){
    out.push('Os '+wp.length+' vídeos mais vistos foram publicados em: '+wp.map(function(v){var p=bsParts(pubT(v));return esc(p.weekday)+' às '+p.hour+'h';}).join('; ')+' (horário de Brasília).');
  }
  var pubs=vs.map(pubT).filter(function(t){return t!=null;}).sort(function(a,b){return a-b;});
  if(pubs.length>=2){
    var span=Math.max((refT()-pubs[0])/DAY,7);
    out.push('Frequência: '+nf1.format(pubs.length/(span/7))+' uploads por semana ('+pubs.length+' vídeos em '+Math.round(span)+' dias).');
  }else if(pubs.length===1)out.push('Só 1 vídeo com data de publicação conhecida — frequência ainda não calculável.');
  if(pubs.length){
    var d=Math.floor((refT()-pubs[pubs.length-1])/DAY);
    out.push('Último upload: '+(d<=0?'hoje':d===1?'há 1 dia':'há '+d+' dias')+(d>7?' — canal parado há mais de uma semana.':'.'));
  }else out.push('Nenhum vídeo com data de publicação conhecida.');
  return out;
}

    h+='<tr class="vr" data-v="'+esc(v.id)+'"><td class="t"><img class="thumb" loading="lazy" src="https://i.ytimg.com/vi/'+esc(v.id)+'/mqdefault.jpg" alt="" onerror="this.style.visibility=\'hidden\'"></td>'+
      '<td class="t ttl">'+vlink(v)+'</td><td><span class="badge'+(v.short?' sh':'')+'">'+(v.short?'Short':'Longo')+'</span></td><td>'+fDur(v.duracao)+'</td>'+
      '<td>'+(p==null?'—':fDate(p)+' <span class="mut">('+daysAgoTxt(p)+')</span>')+'</td><td title="'+fmtFull(v.views)+'">'+fmt(v.views)+'</td><td>'+fmt(v.likes)+'</td><td>'+fmtPct(r.lp,2)+'</td><td>'+fmtD(r.vpd)+'</td>'+
      '<td class="'+dcls(r.d24)+'">'+(r.d24==null?'—':fmtDelta(r.d24))+'</td><td class="'+perfCls+'"><b>'+(r.perf==null?'—':nf1.format(r.perf)+'×')+'</b></td></tr>';
    if(state.open[v.id]){
      h+='<tr class="exp"><td colspan="11" style="text-align:left"><div class="chart" id="sp-'+esc(v.id)+'"></div><div class="note" id="sp-'+esc(v.id)+'n"></div></td></tr>';
      post.push(function(){
        var host=document.getElementById('sp-'+v.id);if(!host)return;
        var pts=(v.serie||[]).map(function(x){return [ts(x[0]),x[1]];}).filter(function(x){return x[0]!=null&&isn(x[1]);});
        lineChart(host,[{name:'Views',color:col,pts:pts}],{h:170});
        if(pts.length<2)document.getElementById('sp-'+v.id+'n').textContent='Só '+pts.length+' coleta(s) deste vídeo até agora — a curva aparece conforme o histórico cresce.';
      });
    }
  });
  h+='</tbody></table></div></div>';
  return h;
}

/* ---------- render ---------- */
function readHash(){var h=decodeURIComponent((location.hash||'').replace(/^#/,''));state.view=h||'geral';}
function render(){
  post=[];
  var cs=canais(),main=document.getElementById('main');
  if(!window.PAINEL){main.innerHTML=(APP||NUVEM)?'<div class="card"><div class="empty">Carregando dados…</div></div>':'<div class="card"><div class="empty">Não foi possível carregar <b>dados.js</b>. Confira se ele está na mesma pasta do painel.html.</div></div>';document.getElementById('tabs').innerHTML='';updStatus();return;}
  var cur=null;cs.forEach(function(c){if(c.id===state.view)cur=c;});
  if(!cur)state.view='geral';
  document.getElementById('tabs').innerHTML='<a class="tab all'+(state.view==='geral'?' on':'')+'" href="#geral">Visão geral</a>'+cs.map(function(c){return '<a class="tab'+(c.id===state.view?' on':'')+'" href="#'+esc(c.id)+'">'+avatar(c,'s')+esc(c.nome||c.id)+'</a>';}).join('')+'<a class="tab addch" href="javascript:void 0" data-addch>＋ Canal</a>';
  var sy=window.scrollY;
  try{main.innerHTML=cur?viewCanal(cur):viewGeral();}
  catch(e){main.innerHTML='<div class="card"><div class="empty">Erro ao montar a página: '+esc(e.message)+'</div></div>';}
  post.forEach(function(f){try{f();}catch(e){}});
  window.scrollTo(0,sy);
  updStatus();
  document.getElementById('foot').textContent='Última coleta: '+fDT(ts(P().atualizado))+' (horário de Brasília) · '+(APP?'app: coleta rápida a cada 2 min, completa a cada 15 min':'atualização automática a cada 5 min');
}
function updStatus(){
  var t=ts(P().atualizado),el=document.getElementById('upd'),w=document.getElementById('warn');
  if(t==null){el.textContent='Atualizado: —';w.innerHTML='';return;}
  var ms=Date.now()-t;
  el.textContent='Atualizado há '+fAgoMs(Math.max(0,ms));
  w.innerHTML=ms>3*HOUR?'<div class="warn">⚠ Os dados estão sem atualizar há mais de 3 horas (última coleta: '+fDT(t)+'). Verifique se a coleta (coletar.py) está rodando.</div>':'';
}

/* ---------- carregamento / eventos ---------- */
var APP=/^(127\.0\.0\.1|localhost)$/.test(location.hostname);
var NUVEM=location.protocol==='https:';
var GIST_USER='TonyWatanabe-dev';
function gistId(){var q=new URLSearchParams(location.search).get('g');if(q){try{localStorage.setItem('painel_gist',q);}catch(e){}return q;}try{return localStorage.getItem('painel_gist');}catch(e){return null;}}
function loadNuvem(){
  var g=gistId(),el=document.getElementById('upd');
  if(!g){if(el)el.textContent='Abra uma vez pelo link completo (com ?g=...) para configurar';return;}
  var base='https://gist.githubusercontent.com/'+GIST_USER+'/'+g+'/raw/',t='?t='+Date.now();
  var get=function(f){return fetch(base+f+t,{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});};
  Promise.all([get('dados.json'),get('dados_pc.json')]).then(function(r){
    var best=r.filter(Boolean).sort(function(a,b){return (ts(b.atualizado)||0)-(ts(a.atualizado)||0);})[0];
    var b=document.getElementById('reload');if(b){b.disabled=false;b.textContent='Atualizar';}
    if(best){window.PAINEL=best;render();}else if(el)el.textContent='Sem conexão — mostrando últimos dados';
  });
}
function applyApi(j){if(j&&j.dados){window.PAINEL=j.dados;render();}var b=document.getElementById('reload');if(b&&j){b.disabled=false;b.textContent='Atualizar agora';}}
function apiGet(url,cb){fetch(url,{cache:'no-store'}).then(function(r){return r.json();}).then(cb).catch(function(){var el=document.getElementById('upd');if(el)el.textContent='App offline — abra pelo atalho Painel YouTube';});}
function refreshNow(){var b=document.getElementById('reload');b.disabled=true;b.textContent='Atualizando…';apiGet('/api/refresh?modo=completo',applyApi);}
function loadData(){
  if(APP){apiGet('/api/data',applyApi);return;}
  if(NUVEM){loadNuvem();return;}
  var old=document.getElementById('dados-js');if(old&&old.parentNode)old.parentNode.removeChild(old);
  var s=document.createElement('script');s.id='dados-js';s.src='dados.js?t='+Date.now();
  s.onload=function(){render();};
  s.onerror=function(){var el=document.getElementById('upd');el.textContent='Falha ao recarregar dados.js — mantendo dados anteriores';};
  document.head.appendChild(s);
}
document.getElementById('reload').addEventListener('click',function(){APP?refreshNow():loadData();});
if(APP)document.getElementById('reload').textContent='Atualizar agora';
window.addEventListener('hashchange',function(){readHash();render();window.scrollTo(0,0);});
document.addEventListener('click',function(e){
  var t=e.target;if(!t.closest)return;
  var m=t.closest('[data-metric]');if(m){state.metric=m.getAttribute('data-metric');render();return;}
  var so=t.closest('[data-sort]');if(so){
    var p=so.getAttribute('data-sort').split(':'),s=p[0]==='r'?state.sortRank:state.sortVid;
    if(s.k===p[1])s.d=-s.d;else{s.k=p[1];s.d=(p[1]==='nome'||p[1]==='titulo')?1:-1;}
    render();return;
  }
  var row=t.closest('tr.vr');if(row&&!t.closest('a')){var id=row.getAttribute('data-v');if(state.open[id])delete state.open[id];else state.open[id]=true;render();}
});
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(render,200);});
setInterval(loadData,(APP||NUVEM)?60*1000:5*60*1000);
if(APP||NUVEM)loadData();
if(NUVEM){document.getElementById('reload').textContent='Atualizar';
  document.addEventListener('visibilitychange',function(){if(!document.hidden)loadData();});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');}
setInterval(updStatus,30*1000);
readHash();render();
window.__painel={loadData:loadData,render:render,applyApi:applyApi,APP:APP,NUVEM:NUVEM,gistId:gistId};
})();
</script>
<div id="chmodal" class="chm" hidden>
  <div class="chm-box">
    <h2 style="margin:0 0 6px">Adicionar canal</h2>
    <div class="note" style="margin:0 0 10px">Cole o link do canal, o @handle ou o ID (UC…).</div>
    <input id="chin" placeholder="https://www.youtube.com/@meucanal" autocomplete="off">
    <div id="chkey" hidden>
      <div class="note" style="margin:12px 0 6px">Primeira vez neste aparelho: o celular precisa de uma chave para editar sua lista.
        <a href="https://github.com/settings/tokens/new?scopes=gist&description=Painel%20YT%20celular" target="_blank" rel="noopener" style="color:var(--acc)">1) Criar chave no GitHub</a>
        (role até o fim e toque em <b>Generate token</b>; deixe só a permissão <b>gist</b>), 2) copie e cole aqui:</div>
      <input id="chtok" placeholder="ghp_…" autocomplete="off">
    </div>
    <div id="chmsg" class="note" style="margin:10px 0 0"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button type="button" id="chcancel">Cancelar</button>
      <button type="button" id="chok" style="background:var(--acc);border-color:var(--acc);color:#fff">Adicionar</button>
    </div>
  </div>
</div>
<style>
.tab.addch{border-style:dashed;color:var(--mut);padding-left:14px;cursor:pointer}
.tab.addch:hover{color:var(--acc);border-color:var(--acc)}
.rmch{color:var(--mut)!important}.rmch:hover{color:var(--bad)!important}
.chm{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
.chm[hidden]{display:none}
.chm-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(460px,100%)}
.chm input{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
</style>
<script>
(function(){
var M=document.getElementById('chmodal'),IN=document.getElementById('chin'),TK=document.getElementById('chtok'),
    KEY=document.getElementById('chkey'),MSG=document.getElementById('chmsg'),OK=document.getElementById('chok');
var GP=function(){return window.__painel||{};};
function tok(){try{return localStorage.getItem('painel_token')||'';}catch(e){return '';}}
function msg(t,bad){MSG.textContent=t;MSG.style.color=bad?'var(--bad)':'var(--tx)';}
function norm(s){s=(s||'').trim();var m=s.match(/(UC[\w-]{22})/);if(m)return m[1];m=s.match(/@([\w.\-]+)/);if(m)return '@'+m[1];
  if(/^[\w.\-]{3,}$/.test(s))return '@'+s;return null;}
function abrir(){M.hidden=false;IN.value='';TK.value='';msg('');KEY.hidden=!(GP().NUVEM&&!tok());OK.disabled=false;setTimeout(function(){IN.focus();},50);}
function fechar(){M.hidden=true;}
// celular: edita canais.txt no gist com a chave guardada no aparelho
function gistApi(method,body){
  return fetch('https://api.github.com/gists/'+GP().gistId(),{method:method,cache:'no-store',
    headers:{'Authorization':'Bearer '+tok(),'Accept':'application/vnd.github+json'},body:body?JSON.stringify(body):undefined})
    .then(function(r){if(r.status===401||r.status===403||r.status===404){try{localStorage.removeItem('painel_token');}catch(e){}throw new Error('Chave inválida ou sem permissão de gist. Crie outra e tente de novo.');}
      if(!r.ok)throw new Error('GitHub respondeu '+r.status);return r.json();});
}
function editarNuvem(fn){
  return gistApi('GET').then(function(g){var f=g.files['canais.txt'];var linhas=(f?f.content:'').split('\n').filter(function(l){return l.trim();});
    var nv=fn(linhas);if(typeof nv==='string')throw new Error(nv);
    return gistApi('PATCH',{files:{'canais.txt':{content:nv.join('\n')+'\n'}}});});
}
function idsAtuais(){return ((window.PAINEL||{}).canais||[]).map(function(c){return c.id;});}
OK.addEventListener('click',function(){
  var ent=norm(IN.value);if(!ent){msg('Não reconheci. Cole o link do canal, o @handle ou o ID (UC…).',true);return;}
  if(idsAtuais().indexOf(ent)>=0){msg('Esse canal já está no painel.',true);return;}
  OK.disabled=true;
  if(GP().APP){
    msg('Adicionando e coletando… (~10 s)');
    fetch('/api/canais/add?c='+encodeURIComponent(IN.value.trim())).then(function(r){return r.json();}).then(function(j){
      if(j.erro_msg){msg(j.erro_msg,true);OK.disabled=false;return;}
      GP().applyApi(j);fechar();}).catch(function(){msg('App offline.',true);OK.disabled=false;});
    return;
  }
  if(GP().NUVEM){
    if(!tok()){var t=TK.value.trim();if(!t){msg('Cole a chave do GitHub primeiro.',true);OK.disabled=false;return;}try{localStorage.setItem('painel_token',t);}catch(e){}}
    msg('Salvando…');
    editarNuvem(function(l){
      if(l.some(function(x){return x.indexOf(ent)>=0;}))return 'Esse canal já está na lista.';
      return l.concat([ent]);
    }).then(function(){msg('✓ Canal adicionado! Ele aparece na próxima coleta: ~2 min com o PC ligado, até ~10–15 min só pela nuvem.');
      setTimeout(fechar,4000);}).catch(function(e){msg(e.message,true);KEY.hidden=!!tok();OK.disabled=false;});
    return;
  }
  msg('Abra pelo app (atalho Painel YouTube) ou pelo celular para adicionar canais.',true);OK.disabled=false;
});
document.getElementById('chcancel').addEventListener('click',fechar);
M.addEventListener('click',function(e){if(e.target===M)fechar();});
IN.addEventListener('keydown',function(e){if(e.key==='Enter')OK.click();});
document.addEventListener('click',function(e){
  var t=e.target.closest&&e.target.closest('[data-addch],[data-rmch]');if(!t)return;
  e.preventDefault();e.stopPropagation();
  if(t.hasAttribute('data-addch')){abrir();return;}
  var id=t.getAttribute('data-rmch'),nome=t.getAttribute('data-nome');
  if(!confirm('Remover "'+nome+'" do painel? (o histórico fica guardado)'))return;
  if(GP().APP){fetch('/api/canais/remove?id='+encodeURIComponent(id)).then(function(r){return r.json();}).then(function(j){location.hash='geral';GP().applyApi(j);});return;}
  if(GP().NUVEM){
    if(!tok()){abrir();msg('Para remover pelo celular, configure a chave primeiro (é a mesma de adicionar).');return;}
    editarNuvem(function(l){return l.filter(function(x){return x.indexOf(id)<0;});})
      .then(function(){alert('Removido. Some do painel na próxima coleta.');}).catch(function(e){alert(e.message);});
  }
},true);
})();
</script>
</body>
</html>
